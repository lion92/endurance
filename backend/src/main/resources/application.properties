spring.application.name=endurance

# --- Base de données : valeurs de développement, surchargées par variables d'environnement
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5442/endurance}
spring.datasource.username=${DB_USER:endurance}
spring.datasource.password=${DB_PASSWORD:endurance}

# --- JPA : Flyway crée le schéma, Hibernate ne fait que le VÉRIFIER
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Actuator : seule la santé est exposée
management.endpoints.web.exposure.include=health
