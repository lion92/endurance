server {
    listen 80;
    root /usr/share/nginx/html;

    # Le site et l'API partagent UNE origine : nginx relaie /api vers le conteneur de l'API.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Les fichiers de Vite portent une empreinte dans leur nom : cache d'un an sans risque.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Application monopage : toute adresse inconnue renvoie index.html, React Router fait le reste.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:";
    }
}
